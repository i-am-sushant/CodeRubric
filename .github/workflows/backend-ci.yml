name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "coderubric/**"
      - "pyproject.toml"
      - "poetry.lock"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "coderubric/**"
      - "pyproject.toml"
      - "poetry.lock"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coderubric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coderubric_test
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_TYPE: ${{ secrets.LLM_API_TYPE || 'openai' }}
      MODEL: gpt-4o-mini

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi
          echo "$(poetry env info --path)/bin" >> $GITHUB_PATH

      - name: Run tests
        run: pytest --tb=short -q
