[tool.poetry]
name = "coderubric"
version = "4.0.3"
description = "AI code review tool that works with any language model provider. It detects issues in GitHub pull requests or local changes—instantly, reliably, and without vendor lock-in."
readme = "README.md"
license = "MIT"
homepage = "https://github.com/Sushant/CodeRubric"
repository = "https://github.com/Sushant/CodeRubric"
documentation = "https://github.com/Sushant/CodeRubric#readme"
keywords = [
    "static code analysis",
    "code review",
    "code quality",
    "ai",
    "coding",
    "assistant",
    "llm",
    "github",
    "automation",
    "devops",
    "developer tools",
    "github actions",
    "workflows",
    "github-actions",
    "git",
    "pull-request",
    "jira",
    "linear",
    "gitlab",
    "ci-cd",
    "static analysis",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Bug Tracking",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
]
authors = [
    "Vitalii Stepanenko <mail@vitaliy.in>"
]
maintainers = [
    "Vitalii Stepanenko <mail@vitaliy.in>",
    "Nikita Sahaidachnyi <nikita.sahaidachnyi@gmail.com>",
    "Dariia Stepanenko <zozulinadarina97@gmail.com>"
]
packages = [
    { include = "gito" },
    { include = "coderubric" },
    { include = "backend" }
]
[tool.poetry.urls]
"Bug Tracker" = "https://github.com/Sushant/CodeRubric/issues"
[tool.poetry.dependencies]
python = "^3.11"
ai-microcore = "~5.0.0"
GitPython = "^3.1.44"
unidiff = "^0.7.5"
google-genai = "~1.56.0"
anthropic = ">=0.57.1,<1"
typer = ">=0.16.0,<0.22"
ghapi = "~=1.0.8"
jira = "^3.10.5"
pydantic = "^2.12.5"
pydantic-settings = "^2.3.0"
# fastcore dependency is fixed becasue 1.12+ does not work in python 3.11, used by ghapi
# https://github.com/AnswerDotAI/fastcore/pull/752
fastcore= "~=1.11.3"
# RAG & Vector Database
chromadb = "^0.5.0"
openai = "^1.30.0"
sentence-transformers = "^2.7.0"
# Backend API
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
websockets = ">=12.0"
# Async & Background Tasks
celery = "^5.4.0"
redis = "^5.0.0"
# Database
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.0"
# Utilities
python-multipart = "^0.0.9"
aiofiles = "^23.2.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}

[tool.poetry.group.dev.dependencies]
flake8 = "*"
flake8-pyproject = "*"
black = "*"
build = "*"
twine = "*"
pylint = "*"
pyflakes = "*"
poetry = "*"

[tool.poetry.group.test.dependencies]
pytest = ">=7.4.3,<10"
pytest-asyncio = ">=0.21.0,<2"
pytest-mock = "^3.12.0"
pytest-cov = ">=4.1.0,<8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
gito = "gito.entrypoint:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-vv --capture=no --log-cli-level=INFO"
testpaths = [
    "tests",
]

[tool.black]
line-length = 100

[tool.flake8]
extend-ignore = ["E203"]
max-line-length = 100
